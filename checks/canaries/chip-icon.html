<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><meta name="expect" content="spill"><meta name="expect-chrome" content=""><title>chip-icon</title><style>body{margin:16px;font:14px/20px sans-serif}svg{max-width:100%}table{width:100%;border-collapse:collapse}td{padding:4px 8px 4px 0;vertical-align:top}.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;font:600 12px/16px monospace;text-transform:uppercase;letter-spacing:.06em;border:1px solid;white-space:nowrap}.chip svg{width:14px;height:14px;flex:none}</style></head><body><!-- A status chip, an icon then its words, in a table column as narrow as its widest word allows. The icon's max-width of 100% lets WebKit count it as nothing when it sizes the column, so the chip comes out an icon's width narrower than its words, which run through its padding and over its border. Chrome sizes it right, so only WebKit finds this. --><table><tr><td>Every column here holds a long sentence that a narrow window wraps onto several lines</td><td><span class="chip"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 20 L4 16 L15 5 L19 9 L8 20 Z"/></svg>In preparation</span></td><td>so each column is set as narrow as its longest word allows</td></tr></table></body></html>
